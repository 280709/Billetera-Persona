version: 1

#
# Billetera Personal — AWS Amplify Hosting
# Stack: React 18 + Vite 5 + PWA (vite-plugin-pwa)
#
# Variables de entorno — configurar en Amplify Console:
#   App settings > Environment variables
#   VITE_SUPABASE_URL  = https://gtnqcwgdqbfyyeagyxpr.supabase.co
#   VITE_SUPABASE_ANON_KEY = eyJ...
#
# Redirect SPA — configurar en Amplify Console:
#   Hosting > Rewrites and redirects > Add rule:
#     Source:  /<*>
#     Target:  /index.html
#     Type:    200 (Rewrite)
#

frontend:
  phases:
    preBuild:
      commands:
        # Usar Node 20 LTS (Vite 5 requiere Node >= 18)
        - nvm install 20
        - nvm use 20
        - node --version
        - npm --version
        # npm ci es más limpio y reproducible que npm install
        - npm ci

    build:
      commands:
        # Inyectar variables de entorno para Vite (SSM no disponible en este entorno)
        - export VITE_SUPABASE_URL=https://gtnqcwgdqbfyyeagyxpr.supabase.co
        - export VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0bnFjd2dkcWJmeXllYWd5eHByIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDc1ODUsImV4cCI6MjA5NDg4MzU4NX0.X9BQCb35ZDpCqzgxh7kQjyE4ozpvMZ3eLcnGy0mrbAU
        - npm run build

  artifacts:
    # Vite genera la build en /dist por defecto
    baseDirectory: dist
    files:
      - '**/*'

  cache:
    paths:
      # Cachear node_modules entre builds para mayor velocidad
      - node_modules/**/*
